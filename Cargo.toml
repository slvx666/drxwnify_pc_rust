[workspace]
resolver = "2"
members = [
    "crates/shared-models",
    "crates/core",
    "crates/network",
    "crates/persistence",
    "crates/audio-engine",
    "crates/playback",
    "crates/providers",
    "crates/stream-resolver",
    "crates/search",
    "crates/library",
    "crates/downloads",
    "crates/cache",
    "crates/lyrics",
    "crates/nostr",
    "crates/friends",
    "crates/discord",
    "crates/windows-integration",
    "apps/drxwnify-mini",
    "benches",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Drxwnify Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/slvx666/drxwnify_pc_rust"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "brotli", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2.0"
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
cpal = "0.15"
rustfft = "6.2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["rand", "serde", "hashes"] }
bech32 = "0.11"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
regex = "1.11"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_Foundation", "Media_Playback", "Media_Control"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Internal workspace crates
drxwnify-shared-models = { path = "crates/shared-models" }
drxwnify-core = { path = "crates/core" }
drxwnify-network = { path = "crates/network" }
drxwnify-persistence = { path = "crates/persistence" }
drxwnify-audio-engine = { path = "crates/audio-engine" }
drxwnify-playback = { path = "crates/playback" }
drxwnify-providers = { path = "crates/providers" }
drxwnify-stream-resolver = { path = "crates/stream-resolver" }
drxwnify-search = { path = "crates/search" }
drxwnify-library = { path = "crates/library" }
drxwnify-downloads = { path = "crates/downloads" }
drxwnify-cache = { path = "crates/cache" }
drxwnify-lyrics = { path = "crates/lyrics" }
drxwnify-nostr = { path = "crates/nostr" }
drxwnify-friends = { path = "crates/friends" }
drxwnify-discord = { path = "crates/discord" }
drxwnify-windows-integration = { path = "crates/windows-integration" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
